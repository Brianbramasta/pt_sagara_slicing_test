<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO SUITE - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B2635', // Warna merah marun utama
                            light: '#FCEEF0',
                            dark: '#6E1D29',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-white min-h-screen flex flex-col items-center relative z-0 overflow-x-hidden">

    <!-- Efek Cahaya / Blur Merah Muda di Belakang Logo -->
    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-[600px] h-[350px] bg-red-100/60 rounded-full blur-[80px] -z-10 pointer-events-none"></div>

    <div class="w-full max-w-[420px] px-6 pt-24 pb-12 flex flex-col items-center">
        
        <!-- Logo -->
        <div class="flex flex-col items-center mb-12">
            <h1 class="text-3xl font-bold text-brand tracking-tighter flex items-center gap-1">
                CEO SUITE
            </h1>
            <p class="text-[7px] text-gray-500 tracking-[0.2em] uppercase mt-1">First Choice for Global Workplace</p>
        </div>

        <!-- Judul Form -->
        <div class="text-center mb-10">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Book your Room Now!</h2>
            <p class="text-[13px] text-gray-500 font-light">Please logged in to flexible and easy access.</p>
        </div>

        <!-- Form Login -->
        <form class="w-full">
            
            <!-- Email Input -->
            <div class="mb-5">
                <label for="email" class="block text-[13px] text-gray-700 mb-2">Email <span class="text-red-500">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" 
                    class="w-full px-4 py-3 rounded border border-gray-200 text-[13px] focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-gray-300 transition">
            </div>

            <!-- Password Input -->
            <div class="mb-5">
                <label for="password" class="block text-[13px] text-gray-700 mb-2">Password <span class="text-red-500">*</span></label>
                <div class="relative">
                    <input type="password" id="password" placeholder="••••••••••••" 
                        class="w-full px-4 py-3 rounded border border-gray-200 text-[13px] focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-gray-300 transition pr-10">
                    <!-- Eye Icon -->
                    <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Options: Remember Me & Forgot Password -->
            <div class="flex justify-between items-center mb-8">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative flex items-center justify-center w-4 h-4">
                        <input type="checkbox" class="peer appearance-none w-4 h-4 border border-gray-300 rounded-sm bg-white checked:bg-brand checked:border-brand cursor-pointer focus:outline-none transition-colors">
                        <svg class="absolute w-2.5 h-2.5 text-white pointer-events-none opacity-0 peer-checked:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <span class="text-[12px] text-gray-700 group-hover:text-gray-900">Remember me</span>
                </label>

                <a href="#" class="text-[12px] text-brand hover:text-brand-dark hover:underline transition">
                    Forgot Password
                </a>
            </div>

            <!-- Sign In Button -->
            <button type="button" class="w-full bg-brand text-white py-3.5 rounded text-[13px] font-medium hover:bg-brand-dark transition shadow-sm mb-6">
                Sign In
            </button>

            <!-- Sign Up Link -->
            <div class="text-center text-[12px] text-gray-500">
                Don't have an account? 
                <a href="#" class="text-brand font-medium hover:underline ml-1">Sign Up Here</a>
            </div>
            
        </form>
    </div>

</body>
</html>
