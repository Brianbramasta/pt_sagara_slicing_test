<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO SUITE - Hero Section Slicing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B2635', // Merah gelap
                            stroke: '#E09299',  // Garis bawah pink
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-white">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-100 py-4 px-6 md:px-12 flex justify-between items-center z-50 relative">
        <!-- Logo -->
        <div class="flex flex-col items-start">
            <h1 class="text-2xl font-bold text-brand tracking-tighter leading-none">CEO SUITE</h1>
            <p class="text-[6px] text-gray-500 tracking-[0.2em] uppercase mt-0.5">First Choice for Global Workplace</p>
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex space-x-8 text-[13px] text-gray-600 font-medium">
            <a href="#" class="hover:text-brand transition">Workspaces</a>
            <a href="#" class="hover:text-brand transition">Services</a>
            <a href="#" class="hover:text-brand transition">Package</a>
            <a href="#" class="hover:text-brand transition">Promotions & Deals!</a>
            <a href="#" class="hover:text-brand transition">News</a>
        </div>

        <!-- User Profile -->
        <div class="flex items-center space-x-3 cursor-pointer group">
            <div class="w-8 h-8 rounded-full bg-[#8E5A9D] text-white flex items-center justify-center text-xs font-medium">
                JD
            </div>
            <div class="hidden sm:flex items-center space-x-1 text-sm text-gray-700 group-hover:text-brand transition">
                <span>Jane Doe</span>
                <svg class="w-4 h-4 text-gray-400 group-hover:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative w-full h-[550px] flex items-center justify-center">
        <!-- Background Image & Overlay -->
        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80" alt="Premium Workspace" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/60"></div> <!-- Dark overlay -->

        <!-- Carousel Arrows -->
        <button class="absolute left-6 top-1/2 transform -translate-y-1/2 text-white/70 hover:text-white transition z-20">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button class="absolute right-6 top-1/2 transform -translate-y-1/2 text-white/70 hover:text-white transition z-20">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <!-- Carousel Indicators (Dots) -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-2 z-20">
            <div class="w-2 h-2 rounded-full bg-brand"></div>
            <div class="w-2 h-2 rounded-full bg-white/40"></div>
            <div class="w-2 h-2 rounded-full bg-white/40"></div>
        </div>

        <!-- Main Content (Text & Form) -->
        <div class="relative z-10 w-full max-w-5xl px-6 flex flex-col items-center mt-[-40px]">
            
            <!-- Headline -->
            <h2 class="text-3xl md:text-4xl font-bold text-white text-center mb-4 tracking-tight">
                <span class="relative inline-block">
                    Elevate Your Workspace
                    <!-- Vector Underline -->
                    <svg class="absolute -bottom-2 left-0 w-full h-3 text-brand-stroke" preserveAspectRatio="none" viewBox="0 0 200 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 9.5C45.5 3.5 130 -1.5 198 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </span> 
                with Premium Work Places.
            </h2>
            <p class="text-white/90 text-[15px] font-light text-center mb-10">
                Discover the next generation of workspaces with our cutting-edge work places.
            </p>

            <!-- Search Form Card -->
            <div class="bg-white rounded-xl p-6 w-full shadow-2xl">
                <form class="flex flex-col">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        <!-- Field 1: Location -->
                        <div>
                            <label class="block text-[13px] text-gray-700 mb-2">Select Location</label>
                            <div class="flex items-center border border-gray-200 rounded-md px-3 py-2.5 bg-white shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand transition">
                                <svg class="w-4 h-4 text-brand mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                                </svg>
                                <input type="text" value="Jakarta, Wisma GKBI" class="w-full bg-transparent text-[13px] text-gray-800 focus:outline-none" readonly>
                            </div>
                        </div>

                        <!-- Field 2: Space Type -->
                        <div>
                            <label class="block text-[13px] text-gray-700 mb-2">Space Type</label>
                            <div class="relative flex items-center border border-gray-200 rounded-md px-3 py-2.5 bg-white shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand transition">
                                <svg class="w-4 h-4 text-brand mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><path d="M9 3v18"></path><path d="M14 12h.01"></path>
                                </svg>
                                <select class="w-full bg-transparent text-[13px] text-gray-800 focus:outline-none appearance-none cursor-pointer">
                                    <option>All Space</option>
                                    <option>Private Office</option>
                                    <option>Co-working</option>
                                </select>
                                <svg class="w-4 h-4 text-gray-500 absolute right-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>

                        <!-- Field 3: Date -->
                        <div>
                            <label class="block text-[13px] text-gray-700 mb-2">Select Date</label>
                            <div class="flex items-center border border-gray-200 rounded-md px-3 py-2.5 bg-white shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand transition">
                                <svg class="w-4 h-4 text-brand mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                <input type="text" value="Mon, 17 August 2024 - Tue, 18 August 2024" class="w-full bg-transparent text-[12px] text-gray-800 focus:outline-none" readonly>
                            </div>
                        </div>

                    </div>
                    
                    <!-- Search Button -->
                    <div class="mt-5 flex justify-end">
                        <button type="button" class="bg-brand text-white px-10 py-2.5 rounded-md text-[13px] font-medium hover:bg-brand-dark transition shadow-sm">
                            Search
                        </button>
                    </div>
                </form>
            </div>
            
        </div>
    </section>

</body>
</html>
